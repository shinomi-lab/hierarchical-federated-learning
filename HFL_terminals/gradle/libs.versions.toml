[versions]
agp                           = "8.13.1"
converterGson                 = "2.9.0"
gson                          = "2.11.0"
jacksonDataformatMsgpack = "0.9.0"
kotlin                        = "2.0.21"
coreKtx                       = "1.16.0"    # core-ktx は削除
junit                         = "4.13.2"
junitVersion                  = "1.2.1"
espressoCore                  = "3.6.1"
kotlinxCoroutinesAndroid      = "1.7.3"
lifecycleRuntimeKtx           = "2.9.1"
activityCompose               = "1.10.1"
composeBom                    = "2025.06.00" # compose-bom は削除
loggingInterceptor            = "4.10.0"
okhttp                        = "4.12.0"
okhttpVersion                 = "4.12.0"
okio                          = "3.7.0"
pytorch_android               = "1.13.1"
lifecycle                     = "2.9.1"
compose                       = "1.8.2"
material3                     = "1.3.2"
pytorch                       = "1.13.1"
retrofit                      = "2.9.0"
firebaseAppdistributionGradle = "5.1.1"
okhttp-logging                = "4.9.3"
coroutines-android            = "1.6.4"
runtime-ktx                   = "1.5.0"
coroutines                    = "1.6.4"
opencsv = "5.7.1"
protobuf = "3.21.12"
protobuf-gradle = "0.8.19"
android-gradle-plugin = "7.2.2"
compose-compiler = "1.5.3"
protobuf-plugin = "0.8.19"      # Protobuf Gradle プラグイン
protobuf-protoc  = "3.21.12"    # protoc コンパイラ


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-dataformat-msgpack = { module = "org.msgpack:jackson-dataformat-msgpack", version.ref = "jacksonDataformatMsgpack" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android-v173 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-v4120 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpVersion" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
pytorch_android = { module = "org.pytorch:pytorch_android", version.ref = "pytorch_android" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
firebase-appdistribution-gradle = { group = "com.google.firebase", name = "firebase-appdistribution-gradle", version.ref = "firebaseAppdistributionGradle" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines-android" }
# Retrofit 本体
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
# Retrofit の Gson コンバータ
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
# Android ランタイム用の Protobuf Lite
# protoc コンパイラ本体
protobuf-protoc   = { group = "com.google.protobuf", name = "protoc",            version.ref = "protobuf" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-protoc" }
commons-codec = { group = "commons-codec", name = "commons-codec", version = "1.16" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle" }
protobuf = { id = "com.google.protobuf", version = "0.9.0" }
