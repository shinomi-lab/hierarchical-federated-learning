# 6次元モデル (Legacy) — 3AP, 4端末, 2エッジ
# AP状態特徴量なし: [tp_norm, rtt_norm, one_hot(4)] = 6次元

experiment:
  name: "3ap_6dim_legacy"
  seed: 42

federation:
  num_edge_servers: 2
  num_terminals: 4
  edge_topology:
    edge-00: [0, 1]
    edge-01: [2, 3]
  num_rounds: 30
  local_rounds: 5

model:
  input_size: 6
  hidden_size: 32
  output_size: 3       # 3 APs
  dropout_p: 0.1

local_training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  clip_max_norm: 1.0
  warmup_steps: 10
  min_lr_ratio: 0.1

data:
  csv_path: "data/3ap_training.csv"
  total_samples: 3000
  iid: true
  use_ap_state: false

  # 3 AP 設定 (initRTT=[90, 100, 110] に対応)
  aps:
    - name: "AP_0"
      tp_mean: 250.0
      rtt_mean: 90.0
      mu_rtt: 8.0
      n_channels: 2
      rtt_noise_std: 10.0
      tp_noise_std: 1.0
    - name: "AP_1"
      tp_mean: 200.0
      rtt_mean: 100.0
      mu_rtt: 12.0
      n_channels: 5
      rtt_noise_std: 10.0
      tp_noise_std: 1.0
    - name: "AP_2"
      tp_mean: 150.0
      rtt_mean: 110.0
      mu_rtt: 15.0
      n_channels: 10
      rtt_noise_std: 10.0
      tp_noise_std: 1.0

output:
  results_dir: "results/compare_3ap"
  verbose: true
