# 自動生成 (ablation/conditions.py)。手で編集しない。
experiment:
  name: async_hfl_ap_selection_hard
  seed: 42
  hfl_mode: async
  baseline_mode: none
  min_switch_rounds: 5
federation:
  num_edge_servers: 2
  num_terminals: 4
  edge_topology:
    edge-00:
    - 0
    - 1
    edge-01:
    - 2
    - 3
  num_rounds: 30
  local_rounds: 5
async:
  k_edge: 2
  k_central: 1
  max_staleness_rounds: 5
  terminal_speed_mean: 1.0
  terminal_speed_std: 0.3
model:
  input_size: 6
  hidden_size: 32
  output_size: 2
  dropout_p: 0.1
local_training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  clip_max_norm: 1.0
  warmup_steps: 10
  min_lr_ratio: 0.1
data:
  total_samples: 3000
  iid: false
  dirichlet_alpha: 0.5
  terminal_apps:
  - 0
  - 1
  - 2
  - 3
  ap_a:
    tp_mean: 50.0
    tp_std: 3.0
    rtt_mean: 20.0
    rtt_std: 5.0
    mu_rtt: 2.0
    n_channels: 2
    rtt_noise_std: 2.0
    tp_noise_std: 1.0
  ap_b:
    tp_mean: 20.0
    tp_std: 2.0
    rtt_mean: 80.0
    rtt_std: 10.0
    mu_rtt: 5.0
    n_channels: 10
    rtt_noise_std: 5.0
    tp_noise_std: 1.0
  app_requirements:
    browser:
      tp_need: 5.0
      rtt_need: 150.0
      type: browser
    video:
      tp_need: 10.0
      rtt_need: 200.0
      type: video
    call:
      tp_need: 0.5
      rtt_need: 100.0
      type: call
    other:
      tp_need: 2.0
      rtt_need: 200.0
      type: other
theory:
  auto_estimate: true
  L: null
  mu: null
  sigma_sq: null
output:
  results_dir: results
  log_format: jsonl
  save_plots: true
  verbose: true
